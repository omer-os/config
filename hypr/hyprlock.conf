# Lock screen. Same look as waybar: terminal green on near-black, flat, square
# corners, no blur. Bound to ALT+SHIFT+Escape (ALT+Escape is wlogout).
#
# The background is a solid colour rather than the wallpaper on purpose: it
# matches the rest of the setup, and it means the lock draws instantly instead
# of waiting on an image decode.

$font  = JetBrainsMono Nerd Font
$bg    = rgba(050a05ff)
$green = rgb(00ff5f)
$dim   = rgb(35c95a)
$muted = rgb(1c6b33)
$crit  = rgb(ff5555)

general {
    hide_cursor = true
    # No grace period -- locking is meant to lock.
    grace = 0
    ignore_empty_input = true
}

# Instant, like the rest of the desktop.
animations {
    enabled = false
}

auth {
    fingerprint {
        enabled = true
    }
}

background {
    monitor =
    color = $bg
}

# ── Clock ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $green
    font_size = 120
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $dim
    font_size = 15
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
}

# Hairline under the clock, same green as the inactive window border.
shape {
    monitor =
    size = 420, 1
    color = $muted
    rounding = 0
    border_size = 0
    position = 0, 10
    halign = center
    valign = center
}

# ── Password ───────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 420, 46
    outline_thickness = 1
    rounding = 0

    outer_color = $muted
    inner_color = $bg
    font_color = $green
    font_family = $font
    check_color = $dim
    fail_color = $crit
    capslock_color = $crit

    placeholder_text = <span foreground="##1c6b33">enter password</span>
    fail_text = <span foreground="##ff5555">$FAIL ($ATTEMPTS)</span>
    hide_input = false
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true

    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = omar@$LAYOUT
    color = $muted
    font_size = 12
    font_family = $font
    position = 0, -110
    halign = center
    valign = center
}

# ── Corners ────────────────────────────────────────────────────────────
label {
    monitor =
    text =   locked
    color = $muted
    font_size = 12
    font_family = $font
    position = 24, -18
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT0/capacity | sed 's/$/%/;s/^/󰁹 /'
    color = $muted
    font_size = 12
    font_family = $font
    position = -24, -18
    halign = right
    valign = top
}
