# Blue-light filter. Replaces gammastep (and the old bluelight.sh toggle).
#
# hyprsunset runs as a daemon from hyprland.start and switches itself on these
# profiles, so there is nothing to remember to turn on. ALT+B forces warm now
# (or back to normal) when a profile boundary is still hours away.
#
# Live control, if you want a one-off value:
#   hyprctl hyprsunset temperature 3000
#   hyprctl hyprsunset identity        # back to normal
#   hyprctl hyprsunset gamma 80

max-gamma = 150

# Daytime: completely untouched colours.
profile {
    time = 07:00
    identity = true
}

# Evening: gentle warmth, still fine for looking at screenshots and UI colour.
profile {
    time = 19:00
    temperature = 4500
    gamma = 100
}

# Night: properly warm and slightly dimmer.
profile {
    time = 22:30
    temperature = 3400
    gamma = 90
}
