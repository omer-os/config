# Empty monitor field applies the wallpaper to every output, so this keeps
# working when the eDP panel is toggled on/off (ALT+SHIFT+D).
preload = ~/Pictures/wallpapers/daniel-leone-v7daTKlZzaw-unsplash.jpg
wallpaper = ,~/Pictures/wallpapers/daniel-leone-v7daTKlZzaw-unsplash.jpg

splash = false
ipc = on
