map ctrl+shift+a launch --type=clipboard --stdin-source=@screen_scrollback
confirm_os_window_close 0

# Translucent background so Hyprland's window blur shows through (frosted glass).
background_opacity 0.55

# Copy anything selected with the mouse straight to the system clipboard.
copy_on_select clipboard

# ── Ember forest: pulled from the ember-forest wallpaper ──────────
foreground            #e6d8c9
background            #110c0a
selection_foreground  #110c0a
selection_background  #f0782d
cursor                #ff9a4d
cursor_text_color     #110c0a
url_color             #93bdb5
active_border_color   #f0782d
inactive_border_color #2e2019
active_tab_foreground   #110c0a
active_tab_background   #f0782d
inactive_tab_foreground #a3826a
inactive_tab_background #181109

color0  #1e1511
color8  #5c4636
color1  #d9573b
color9  #f07a5c
color2  #8fa870
color10 #adc48c
color3  #e8a13c
color11 #f5c26b
color4  #6f9a94
color12 #93bdb5
color5  #b58a9e
color13 #d1a9ba
color6  #7fb3a2
color14 #a2cfbf
color7  #c2a791
color15 #efe3d6

# Lets hypr/scripts/zen.sh make every kitty window solid while zen mode is on.
# Socket-only, so nothing outside this user's session can drive kitty.
allow_remote_control socket-only
listen_on unix:@kitty
dynamic_background_opacity yes
